name: Daily Netlify Build Trigger

on:
  schedule:
    # Runs every day at 00:05 UTC (Midnight UTC)
    - cron: '5 0 * * *'
  # Enables a "Run workflow" button in GitHub so you can test it manually anytime
  workflow_dispatch:

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Build Hook
        run: |
          curl -X POST -d {} ${{ secrets.NETLIFY_BUILD_HOOK }}
