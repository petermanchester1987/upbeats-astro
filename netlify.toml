[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Gives the newsletter function a clean, stable URL instead of exposing
# Netlify's own /.netlify/functions/... path in client-side JS.
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
